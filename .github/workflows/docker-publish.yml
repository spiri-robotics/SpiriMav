name: Build and Publish Docker Image

# Registry defaults to GHCR and needs no secrets there (uses GITHUB_TOKEN).
# To publish elsewhere instead, set repository variables (Settings > Secrets
# and variables > Actions > Variables) without touching this file:
#   REGISTRY   - e.g. docker.io (default: ghcr.io)
#   IMAGE_NAME - e.g. myorg/spiri_mav (default: the GitHub repo name)
# If REGISTRY is docker.io, also add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
#
# The image is built for amd64 and arm64, each on a native runner (QEMU is
# far too slow for real builds), pushed by digest, and the merge job joins
# the two digests into one multi-arch tag.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Compute image name
        id: image
        # GHCR requires a lowercase image name, but github.repository keeps
        # the repo's actual casing and GitHub Actions expressions have no
        # lowercase function -- shell out instead of relying on every repo
        # being named all-lowercase.
        run: |
          IMAGE_NAME="${{ vars.IMAGE_NAME }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          fi
          echo "name=${{ env.REGISTRY }}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'docker.io' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ env.REGISTRY == 'docker.io' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.image.outputs.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch.name }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [image, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY == 'docker.io' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ env.REGISTRY == 'docker.io' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.image.outputs.name }}@sha256:%s ' *)
          docker buildx imagetools inspect ${{ needs.image.outputs.name }}:${{ steps.meta.outputs.version }}
