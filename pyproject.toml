[project]
name = "SpiriMav"
version = "0.1.0"
description = "MAVLink vehicle bridge for SpiriSynq: a companion-computer GCS that mirrors autopilot state"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Alex Davies", email = "traverse.da@gmail.com"}]
license = "MIT"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "pymavlink>=2.4.50",
    "spirisynq>=0.4.0",
    "typer>=0.26.8",
]
[project.optional-dependencies]
docs = ["sphinx>=9.1.0", "furo>=2024.0", "myst-parser>=5.1.0"]

[project.scripts]
SpiriMav = "spiri_mav.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiri_mav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.0.0",
]
